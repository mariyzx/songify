version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: songify_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-songify}
      MYSQL_USER: ${MYSQL_USER:-songify_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-songify_pass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build: .
    container_name: songify_backend
    restart: always
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      DATABASE_URL: "mysql://${MYSQL_USER:-songify_user}:${MYSQL_PASSWORD:-songify_pass}@db:3306/${MYSQL_DATABASE:-songify}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  mysql_data:
